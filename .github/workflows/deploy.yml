# Builds the site and puts it on Cloudflare (a Worker serving the static files), privately: Cloudflare
# Access lets only ALLOWED_EMAIL open it. Runs ONLY when started by hand:
# Actions tab > "Deploy to Cloudflare (private)" > Run workflow.
#
# Repository secrets it needs (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   token with "Workers Scripts: Edit" and "Access: Apps and Policies: Edit"
#   CLOUDFLARE_ACCOUNT_ID  your Cloudflare account ID
#   ALLOWED_EMAIL          the email address that may open the site
name: Deploy to Cloudflare (private)

on:
  workflow_dispatch:
    inputs:
      name:
        description: "Worker name (the site will be https://<name>.<your-subdomain>.workers.dev)"
        default: "bcu-web-xzsg7a"
        required: true

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ALLOWED_EMAIL: ${{ secrets.ALLOWED_EMAIL }}
      NAME: ${{ inputs.name }}
    steps:
      - name: Check the secrets are set
        run: |
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ALLOWED_EMAIL; do
            [ -n "${!v}" ] || { echo "::error::Repository secret $v is missing"; exit 1; }
          done
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build (TeaVM + asset index)
        run: |
          ./gradlew generateJavaScript --console=plain
          pip install cryptography
          python tools/build_index.py --out site/data/index.json
      - name: Make sure the account has a workers.dev subdomain
        run: echo "SUBDOMAIN=$(python tools/cloudflare_access.py subdomain)" >> "$GITHUB_ENV"
      - name: Upload with the public address switched off
        run: |
          write_config() {
            cat > wrangler.json <<EOF
          { "name": "$NAME", "compatibility_date": "2026-09-01", "assets": { "directory": "./site" },
            "workers_dev": $1, "preview_urls": false }
          EOF
          }
          write_config false
          npx -y wrangler@4 deploy
      - name: Lock the Worker with Cloudflare Access
        run: python tools/cloudflare_access.py lock "$NAME"
      - name: Switch the address on (now behind the lock)
        run: |
          cat > wrangler.json <<EOF
          { "name": "$NAME", "compatibility_date": "2026-09-01", "assets": { "directory": "./site" },
            "workers_dev": true, "preview_urls": false }
          EOF
          npx -y wrangler@4 deploy
      - name: Check the site is locked
        run: |
          url="https://$NAME.$SUBDOMAIN.workers.dev/"
          for i in 1 2 3 4 5 6; do
            sleep 15
            code=$(curl -s -o /dev/null -w "%{http_code} %{redirect_url}" "$url")
            echo "$url -> $code"
            case "$code" in
              30[0-9]*cloudflareaccess.com*) echo "OK: visitors are sent to the Cloudflare Access sign-in."; echo "### Site: $url" >> "$GITHUB_STEP_SUMMARY"; exit 0 ;;
            esac
          done
          echo "::error::The site did not redirect to the Cloudflare Access sign-in. Switching its address off again."
          sed -i 's/"workers_dev": true/"workers_dev": false/' wrangler.json
          npx -y wrangler@4 deploy
          exit 1
