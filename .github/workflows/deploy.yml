# Builds the site and puts it on Cloudflare Pages, privately (Cloudflare Access: only ALLOWED_EMAIL can
# open it). Runs ONLY when started by hand: Actions tab > "Deploy to Cloudflare (private)" > Run workflow.
#
# Repository secrets it needs (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   token with "Cloudflare Pages: Edit" and "Access: Apps and Policies: Edit"
#   CLOUDFLARE_ACCOUNT_ID  your Cloudflare account ID
#   ALLOWED_EMAIL          the email address that may open the site
name: Deploy to Cloudflare (private)

on:
  workflow_dispatch:
    inputs:
      project:
        description: "Cloudflare Pages project name (the site will be https://<name>.pages.dev)"
        default: "bcu-web-xzsg7a"
        required: true

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ALLOWED_EMAIL: ${{ secrets.ALLOWED_EMAIL }}
      PROJECT: ${{ inputs.project }}
    steps:
      - name: Check the secrets are set
        run: |
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ALLOWED_EMAIL; do
            [ -n "${!v}" ] || { echo "::error::Repository secret $v is missing"; exit 1; }
          done
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build (TeaVM + asset index)
        run: |
          ./gradlew generateJavaScript --console=plain
          pip install cryptography
          python tools/build_index.py --out site/data/index.json
      - name: Lock the address with Cloudflare Access first (so the site is never public)
        run: python tools/cloudflare_access.py "$PROJECT"
      - name: Create the Pages project (first time only)
        run: |
          if npx -y wrangler@4 pages project list 2>/dev/null | grep -qw "$PROJECT"; then
            echo "Pages project $PROJECT exists"
          else
            npx -y wrangler@4 pages project create "$PROJECT" --production-branch main
          fi
      - name: Upload the site
        run: npx -y wrangler@4 pages deploy site --project-name "$PROJECT" --branch main --commit-dirty=true
      - name: Check the site is locked
        run: |
          sleep 20
          code=$(curl -s -o /dev/null -w "%{http_code} %{redirect_url}" "https://$PROJECT.pages.dev/")
          echo "https://$PROJECT.pages.dev/ -> $code"
          case "$code" in
            30[0-9]*cloudflareaccess.com*) echo "OK: visitors are sent to Cloudflare Access sign-in." ;;
            *) echo "::error::The site did not redirect to Cloudflare Access sign-in. Check Zero Trust > Access > Applications."; exit 1 ;;
          esac
